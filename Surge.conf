# BASE = https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/

RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Tailscale-Direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Bootstrap-Direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Lan.list,DIRECT,no-resolve
