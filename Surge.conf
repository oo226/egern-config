RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Direct-Priority.list,DIRECT,no-resolve

RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Zhuifeng.list,追风挂机
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Foreign/Spotify.list,Spotify

