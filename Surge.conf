[MITM]
# 在 Surge → MitM → 生成新证书并安装信任；勿把 ca-p12 提交到公开仓库
# hostname 与 Egern 对齐；模块还会 %APPEND% 更多主机名
hostname = weatherkit.apple.com, configuration.ls.apple.com, gspe35-ssl.ls.apple.com, gspe35-ssl.ls.apple.cn, gspe1-ssl.ls.apple.com, dispatcher.is.autonavi.com, api.pingmeapp.net, *.pingmeapp.net
skip-server-cert-verify = false
# 可选排除（Surge 用 hostname 否定语法因版本而异；冲突时在模块里关）

