[Rule]
# 顺序：域名类 → 混合 RULE-SET → IP 类（Sukka：先 domainset/non_ip，再 ip，避免抢先 DNS）
# BASE = .../surge/Rules/

# Tailscale 分流（根因修复）：
# - skip-proxy 对 VIF 无效
# - always-real-ip 含 *.tailscale.com → 连接以「IP:443」进规则引擎，默认 DOMAIN* 不看 SNI → 整表 miss → FINAL
# - 必须 extended-matching，让 DOMAIN-SET/RULE-SET 按 TLS SNI（derp*.tailscale.com）命中
DOMAIN-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Tailscale-Direct.domainset,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Tailscale-Direct.list,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Tailscale-Direct.ip.list,DIRECT,no-resolve
# 审计：凡域名 RULE-SET/DOMAIN-SET 均加 extended-matching（VIF + always-real-ip 时按 SNI 命中）。
# 纯 IP 表（*.ip.list）不加。不影响 Egern（Egern 用 Routing/*.yaml，不读 Surge Rules/*.list）。
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Bootstrap-Direct.list,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Lan.list,DIRECT,no-resolve,extended-matching
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Unbreak.list,DIRECT,extended-matching
# TestFlight 与 Egern 一致：走 Direct-Priority → DIRECT（勿单独改代理）。
# 打不开时不是分流问题：合集曾 REJECT 全部 UDP/443 和 AASA CDN，已在解锁合集 tf4 去掉。
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Direct-Priority.list,DIRECT,no-resolve,extended-matching

RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Zhuifeng.list,追风挂机,extended-matching
RULE-SET,https://raw.githubusercontent.com/oo226/egern-config/refs/heads/surge/Rules/Foreign/Spotify.list,Spotify,extended-matching

# 去广告：大表用 DOMAIN-SET（与 Sukka reject domainset 同思路；关键词/IP 极少可忽略）
