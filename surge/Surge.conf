🐓B = select, policy-path=https://你的订阅链接-B, policy-regex-filter=^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量|倍率).)+$, update-interval=86400, hidden=true, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge%281%29.png?v=3
🐓C = select, policy-path=https://你的订阅链接-C, policy-regex-filter=^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量|倍率).)+$, update-interval=86400, hidden=true, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge%281%29.png?v=3
🐓 = select, include-other-group="🐓B,🐓C", hidden=true, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge%281%29.png?v=3

兜底 = url-test, include-other-group="🐓.,🐓", interval=300, tolerance=50, timeout=5, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/quanx.png?v=3

