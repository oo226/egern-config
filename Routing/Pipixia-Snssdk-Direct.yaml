# 类型: 分流规则 — 皮皮虾等国内字节 snssdk 直连
# 须排在 TikTok 规则之前：TikTok.list 含整域 snssdk.com，会把皮皮虾的
# effect.snssdk.com / *-lq.snssdk.com 误判成 TikTok 走海外节点。
# 海外 TikTok 仍走 tiktok.com / tiktokv.com / isnssdk.com 等，不受影响。

no_resolve: true
domain_set:
  - effect.snssdk.com
  - iu-lq.snssdk.com
  - lf-lq.snssdk.com
domain_keyword_set:
  # 国内机房：勿用前导「-」（部分引擎 keyword 匹配异常）；lq/hl 足够区分海外
  - lq.snssdk.com
  - hl.snssdk.com
