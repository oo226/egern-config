# Curated paths copied from sync branch → main after daily upstream build.
# Egern raw URLs under main/ must stay stable — edit with care.

files:
  - Egern.yaml
  - README.md
  - USAGE.md
  - DISCLAIMER.md
  - .github/workflows/sync-rules.yml
  - .github/workflows/pages.yml
  - site/index.html
  - site/catalog.json
  - site/disclaimer.html
  - site/styles.css
  - site/manifest.webmanifest
  - site/sw.js
  - site/robots.txt
  - site/upstreams.json
  - site/collection-diff.json

directories:
  - path: Routing
    exclude_dirs: [_upstream, Surge]

  # 模块中心：单条/合集全进 main，用户在 Pages 自挑（避免只靠巨型合集爆内存）
  - path: Modules
    include_globs:
      - "*.sgmodule"
      - "*.module"
      - "*.yaml"
      - "README.md"
      - "egern.boxjs.json"
      - "yu9191-player.boxjs.json"
    exclude_globs:
      - "manifest.yaml"
      - "manifest.surge.yaml"
      - "unlock-manifest.yaml"
      - "cookie-manifest.yaml"
    include_dirs:
      - yuheng
      - qingrex-signin
      - _upstream

  - path: Scripts
    exclude_dirs: []
    include_root_glob: "*.js"
    include_subdirs:
      - _external
      - _stubs
      - fmz200
      - chxm1023
      - ddgksf2013
      - liul0ng
      - tencent-sports
      - weibo
      - weigiegie
      - xiaohongshu
      - yu9191
      - yuheng
      - zenmofeishi
    extra_files:
      - README.md

  - path: Assets
    include_subdirs:
      - geoip
      - icons

  - path: Widgets
    include_subdirs:
      - IBL3ND

# Removed from main on each publish (factory / CI-only on sync).
prune_from_main:
  - Routing/_upstream
  - Routing/Surge
  - Surge.conf
  - surge
  - Modules/manifest.yaml
  - Modules/unlock-manifest.yaml
  - Modules/cookie-manifest.yaml
  - Modules/manifest.surge.yaml
  - scripts
  - publish
  - push-github.ps1
  - 推送到GitHub.bat
