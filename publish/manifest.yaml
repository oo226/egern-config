# Curated paths copied from sync branch → main after daily upstream build.
# Egern raw URLs under main/ must stay stable — edit with care.

files:
  - Egern.yaml
  - README.md
  - USAGE.md
  - DISCLAIMER.md
  - .github/workflows/sync-rules.yml
  - .github/workflows/pages.yml
  - site/index.html
  - site/catalog.json
  - site/disclaimer.html
  - site/styles.css
  - site/manifest.webmanifest
  - site/sw.js
  - site/robots.txt
  - site/upstream-proxy-detect.json
  - site/upstreams.json
  - site/collection-diff.json

directories:
  - path: Routing
    exclude_dirs: [_upstream]

  - path: Modules
    include_only:
      - README.md
      - adblock-collection.module
      - unlock-collection.module
      - skip-proxy-collection.module
      - cookie-collection.module
      - spotify-unlock.sgmodule
      - spotify-dualsubs.sgmodule
      - pingme.sgmodule
      - qdreader.sgmodule
      - ibl3nd-plugin-hub.yaml
      - iringo-mitm.yaml
      - iringo-maps.sgmodule
      - iringo-weather.sgmodule
      - iringo-location.sgmodule
      - iringo-others.sgmodule
      - yu9191-player.boxjs.json
      - egern.boxjs.json
    # 逐个模块（保留 #!arguments，防删库镜像）
    include_dirs:
      - yuheng
      - qingrex-signin

  - path: Scripts
    exclude_dirs: []
    include_root_glob: "*.js"
    include_subdirs:
      - _external
      - _stubs
      - fmz200
      - chxm1023
      - liul0ng
      - tencent-sports
      - weibo
      - weigiegie
      - xiaohongshu
      - yu9191
      - yuheng
      - zenmofeishi
    extra_files:
      - README.md

  - path: Assets
    include_subdirs:
      - geoip
      - icons

  - path: Widgets
    include_subdirs:
      - IBL3ND

# Removed from main on each publish (factory / CI-only on sync).
prune_from_main:
  - Routing/_upstream
  - Modules/_upstream
  - Modules/manifest.yaml
  - Modules/unlock-manifest.yaml
  - Modules/cookie-manifest.yaml
  - Modules/qingrex-adblock.sgmodule
  - Modules/qingrex-unlock.sgmodule
  - Modules/fmz200-extra.sgmodule
  - Modules/fmz200-unlock-extra.sgmodule
  - Modules/custom-apps.sgmodule
  - Modules/patches-unlock.sgmodule
  - Modules/patches-alicloud.sgmodule
  - Modules/boxjs.sgmodule
  - Modules/chxm1023-ad-supplement.sgmodule
  - Modules/yu9191-rewrite-unlock.sgmodule
  - Modules/liul0ng-unlock.sgmodule
  - Modules/weigiegie-unlock.sgmodule
  - Modules/proxy-detect-extra.sgmodule
  - Modules/unlock-primary.sgmodule
  - Modules/qdreader-cookie-extra.sgmodule
  - scripts
  - publish
  - push-github.ps1
  - 推送到GitHub.bat
