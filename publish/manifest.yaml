# Curated paths copied from sync branch → main after daily upstream build.
# Egern raw URLs under main/ must stay stable — edit with care.
#
# Declutter policy (2026-09):
# - main = what you open in Egern / the hub (lean names)
# - sync = factory (merge scripts, intermediates, aliases sources)
# - Compatibility aliases (adblock-egern*) stay published so old module URLs keep working,
#   but are hidden from the hub catalog.

files:
  - Egern.yaml
  - README.md
  - USAGE.md
  - DISCLAIMER.md
  - .github/workflows/sync-rules.yml
  - .github/workflows/pages.yml
  - site/index.html
  - site/catalog.json
  - site/disclaimer.html
  - site/styles.css
  - site/manifest.webmanifest
  - site/sw.js
  - site/robots.txt
  - site/upstreams.json
  - site/collection-diff.json

directories:
  - path: Routing
    exclude_dirs: [_upstream, Surge]
    # Merge intermediates — Egern uses AI-Merged only; keep sources on sync.
    exclude_files:
      - Foreign/AI.yaml
      - Foreign/AI-supplement.yaml

  - path: Modules
    include_only:
      - README.md
      # Canonical entrance
      - adblock-collection.module
      # Compatibility aliases (same bytes; old Egern URLs)
      - adblock-egern.module
      - adblock-egern-v0815b.module
      - adblock-egern-v0815c.module
      - unlock-collection.module
      - cookie-collection.module
      - pingme.sgmodule
      # Deprecated duplicate of pingme.sgmodule — keep URL alive, hub-hidden
      - pingme.yaml
      - nb-weixin-fix.yaml
      - qdreader.sgmodule
      - ibl3nd-plugin-hub.yaml
      - iringo-mitm.yaml
      - iringo-maps.sgmodule
      - iringo-weather.sgmodule
      - iringo-location.sgmodule
      - iringo-others.sgmodule
      - yu9191-player.boxjs.json
      - egern.boxjs.json
    # Per-module mirrors with #!arguments (anti-delete)
    include_dirs:
      - yuheng
      - qingrex-signin

  - path: Scripts
    exclude_dirs: []
    include_root_glob: "*.js"
    # Layer map (see Scripts/README.md):
    #   root *.js     = check-ins you might enable
    #   _external/    = collection black-box deps
    #   <author>/     = full upstream mirrors (anti-delete)
    include_subdirs:
      - _external
      - _stubs
      - fmz200
      - chxm1023
      - ddgksf2013
      - liul0ng
      - tencent-sports
      - weibo
      - weigiegie
      - xiaohongshu
      - yu9191
      - yuheng
      - zenmofeishi
    extra_files:
      - README.md

  - path: Assets
    include_subdirs:
      - geoip
      - icons

  - path: Widgets
    include_subdirs:
      - IBL3ND

# Removed from main on each publish (factory / CI-only on sync).
prune_from_main:
  - Routing/_upstream
  - Routing/Surge
  - Routing/Foreign/AI.yaml
  - Routing/Foreign/AI-supplement.yaml
  - Surge.conf
  - surge
  - Modules/_upstream
  - Modules/manifest.yaml
  - Modules/unlock-manifest.yaml
  - Modules/spotify-dualsubs.sgmodule
  - Modules/cookie-manifest.yaml
  - Modules/qingrex-adblock.sgmodule
  - Modules/patches-pipixia.sgmodule
  - Modules/qingrex-unlock.sgmodule
  - Modules/fmz200-extra.sgmodule
  - Modules/fmz200-unlock-extra.sgmodule
  - Modules/custom-apps.sgmodule
  - Modules/patches-unlock.sgmodule
  - Modules/patches-alicloud.sgmodule
  - Modules/boxjs.sgmodule
  - Modules/chxm1023-ad-supplement.sgmodule
  - Modules/yu9191-rewrite-unlock.sgmodule
  - Modules/liul0ng-unlock.sgmodule
  - Modules/weigiegie-unlock.sgmodule
  - Modules/proxy-detect-extra.sgmodule
  - Modules/skip-proxy-collection.module
  - Modules/spotify-unlock.sgmodule
  - Modules/unlock-primary.sgmodule
  - Modules/qdreader-cookie-extra.sgmodule
  - scripts
  - publish
  - push-github.ps1
  - 推送到GitHub.bat
