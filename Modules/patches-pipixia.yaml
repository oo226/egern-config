name: 皮皮虾「我的」页精简
description: 静音处理 check_in（response_jq，不进 Script 日志）。去广告/去水印仍走合集里的皮皮虾 Script。
author: oo226/egern-config
homepage: https://github.com/oo226/egern-config
category: 去广告补全
body_rewrites:
  # Egern 原生 jq：过滤「我的」入口 + 宠物乐园提示（可莉同款字段）
  - response_jq:
      match: ^https?:\/\/[^\/]*\.pipix\.com\/bds\/user\/check_in
      filter: >-
        (if .data.profile_entrances then
          .data.profile_entrances |= map(select(
            .title != "放心借"
            and .title != "洋钱罐借款"
            and .title != "创作中心"
            and .title != "原创特权"
            and .title != "小黑屋"
            and .title != "我的订单"
            and .title != "银行卡管理"
            and .title != "神评鉴定"
            and .title != "宠物乐园"
            and .title != "进入宠物乐园"
          ))
        else . end)
        | del(.data.pet_interface_message)
        | del(.data.pet_entrance)
        | del(.data.pet_paradise)
        | del(.data.activity_banner)
        | del(.data.profile_banner)
        | del(.data.loan_entrance)
        | del(.data.credit_entrance)
  # 正文级兜底：去水印标记（不解析 JSON，无日志）
  - response_regex:
      match: ^https?:\/\/[^\/]*\.pipix\.com\/bds\/(feed\/stream|cell\/detail)
      find: tplv-ppx-logo\.image
      replace: 0x0.gif
  - response_regex:
      match: ^https?:\/\/[^\/]*\.pipix\.com\/bds\/(feed\/stream|cell\/detail)
      find: tplv-ppx-logo
      replace: 0x0
  - response_regex:
      match: ^https?:\/\/[^\/]*\.pipix\.com\/bds\/(feed\/stream|cell\/detail)
      find: '"can_download":false'
      replace: '"can_download":true'
mitm:
  hostnames:
    includes:
      - "*.pipix.com"
      - api.pipix.com
      - api5-lq.pipix.com
