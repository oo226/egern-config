name: NB·微信修复
description: |
  不拉主配置也能用：NB 控制口 + NBPro 脚本 + 微信公众号。
  NB：telnet=Network OK；/nb/app 用墨鱼脚本改广告（勿空 Map Local，否则「格式不正确」）。
  微信：空 getappmsgad + wxgzhad；素材 CDN 靠合集/Reject-Hot 的 wxa/wximg/wxsmw。
author: oo226/egern-config + ddgksf2013
homepage: https://github.com/oo226/egern-config
category: 去广告

map_locals:
  - match: '^https?://[^/]*nbtool8\.com(?::\d+)?/nb/telnet'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: "Network OK"
  - match: '^https?://124\.222\.32\.246(?::\d+)?/nb/telnet'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: "Network OK"
  - match: '^https?://117\.72\.39\.157(?::\d+)?/nb/telnet'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: "Network OK"
  - match: '^https?://47\.243\.71\.210(?::\d+)?/nb/telnet'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: "Network OK"
  - match: '^https?://cesapp\.goypzc\.cn(?::\d+)?/nb/telnet'
    status_code: 200
    headers:
      Content-Type: text/plain
    body: "Network OK"
  - match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/getappmsgad'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"advertisement_num":0,"advertisement_info":[]}'
  - match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/(cps_product_info|jsmonitor|masonryfeed|relatedarticle|relatedsearchword|searchkeywordreport)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'

scriptings:
  - http_response:
      name: NBPro去广告
      match: '^https?://(?:[^/]*nbtool8\.com|124\.222\.32\.246|117\.72\.39\.157|47\.243\.71\.210|cesapp\.goypzc\.cn)(?::\d+)?/nb/app'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/ddgksf2013/nbpro.ads.js
      body_required: true
      max_size: -1
      timeout: 60
      enabled: true
  - http_response:
      name: 微信公众号广告
      match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/(getappmsgad|getappmsgext)'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/chxm1023/advertising/wxgzhad.js
      body_required: true
      max_size: -1
      timeout: 60
      enabled: true

mitm:
  hostnames:
    includes:
      - nbtool8.com
      - api.nbtool8.com
      - www.nbtool8.com
      - app.nbtool8.com
      - cesapp.goypzc.cn
      - 124.222.32.246
      - 117.72.39.157
      - 47.243.71.210
      - mp.weixin.qq.com
