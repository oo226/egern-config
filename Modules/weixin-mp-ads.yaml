name: 微信公众号去广告
description: |
  路径 REJECT（见 Routing/Weixin-Ad-Reject，须排在 weixin/wxs DIRECT 前）+ Map Local + 脚本。
  广告素材 CDN（wxsmw / wxsnsdy）REJECT → 卡片壳在、图/视频黑；勿整域拒 wxs（会灰正文图）。
  getappmsgext 只剥 advertisement_*。勿 MITM short.weixin mmtls。
author: oo226/egern-config
homepage: https://github.com/oo226/egern-config
category: 去广告
# 双保险：即使分流 REJECT 未命中，Map Local 仍可空掉广告接口
map_locals:
  - match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/getappmsgad'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"advertisement_num":0,"advertisement_info":[]}'
  - match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/(cps_product_info|jsmonitor|masonryfeed|relatedarticle|relatedsearchword|searchkeywordreport)'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/tp/datareport'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
scriptings:
  - http_response:
      name: 微信公众号广告
      match: '^https?://mp\.weixin\.qq\.com(?::\d+)?/mp/(getappmsgad|getappmsgext)'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/chxm1023/advertising/wxgzhad.js
      body_required: true
      max_size: -1
      timeout: 60
      enabled: true
mitm:
  hostnames:
    includes:
      - mp.weixin.qq.com
