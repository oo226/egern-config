    "https://raw.perzikkop.com/Scripts/Taobao.js": "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/fmz200/applet.js"
    "https://raw.perzikkop.com/Scripts/12306.js": "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/fmz200/header.js"
