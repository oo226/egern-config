# Mirrored ad-block sources, merged & deduplicated by Actions.
# Output: Modules/adblock-collection.module

merge:
  output: adblock-collection.module
  # Surge 认文件最前的 #!name；勿用 & 等特殊字符
  primary_name: 去广告合集
  primary_desc: 奶思 + blackmatrix7 + 银行税务NB 去广告合集
  header_lines:
    - "# AUTO-MERGED by scripts/merge-adblock-modules.py"
    - "# 类型: 模块 — 去广告/去开屏/净化（URL Rewrite + MITM + Script）"
    - "# Primary: fmz200 blockAds | Supplements: blackmatrix7 + 本仓库 NB/银行补全"
    - "# Do not edit manually. Updated by GitHub Actions after upstream sync."
    - ""
  exclude_cron_scripts: true
  # 主配置 knobs 不进合集（Fries/奶思 General 会叠装截断、改写用户偏好）
  drop_general_keys:
    - skip-proxy
    - always-real-ip
    - hide-vpn-icon
    - use-local-host-item-for-proxy
    - encrypted-dns-follow-outbound-mode
  # Avoid MITM on googleapis.com to prevent breaking Gemini (certificate pinning / sensitive APIs).
  mitm_hostname_excludes:
    - "*.googleapis.com"
  # 兼容旧字段（drop 后不再写入）；邮储/税务勿进主配置 skip-proxy，以免废去开屏 MITM
  skip_proxy_excludes:
    - "*.chinatax.gov.cn"
    - chinatax.gov.cn
    - etax.chinatax.gov.cn
    - login-service.mobile-bank.psbc.com
    - mobile-bank.psbc.com
    - static.mobile-bank.psbc.com
    - static.psbc.com
    - mcc.psbc.com
    - d.psbc.com
    - "*.psbc.com"
  # Spotify VIP 解锁只走 unlock 合集的 Eevee，勿在去广告合集叠跑 Crack
  content_line_excludes:
    - "Spotify.Crack.Dev.js"
    - "Spotify.Crack.js"
    # chxm1023 误把皮皮虾主接口 /bds/ 写进「行为监控」reject，评论回复会被直接拦空
    - "snssdk.com\\/(bds|monitor|trace|log)"
  script_url_fixes:
