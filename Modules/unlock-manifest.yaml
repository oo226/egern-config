# Unlock / utility modules merged into unlock-collection.module
# One URL for Egern: Modules/unlock-collection.module

merge:
  output: unlock-collection.module
  primary_desc: "多源合并去重：跳过代理检测 + 链接解锁 + Spotify + VIP解锁 + 屏蔽更新（Actions 每日同步）"
  header_lines:
    - "# AUTO-MERGED by scripts/merge-adblock-modules.py"
    - "# 类型: 模块 — 解锁/增强（链接解锁、Spotify、跳过代理检测、屏蔽更新等）"
    - "# Do not edit manually. Updated by GitHub Actions after upstream sync."
    - "#"
    - "# Sources: mieqq, Sukka RealIP, QingRex(可莉), chxm1023/ddm1023, Yu9191, miranquil, iEwha, ddgksf2013, WeiGiegie, liul0ng, proxy-detect scan, local patches"
    - "# Spotify VIP: spotify-unlock.sgmodule (Eevee) — 排除旧 app2smile proto / Spotify.Crack 叠跑"
    - ""
  # 旧 Spotify 解锁脚本与实测可用的 Eevee 冲突，合并时剔除
  # DualSubs Spotify 已拆成独立模块 spotify-dualsubs.sgmodule（保留 #!arguments）
  content_line_excludes:
    - "app2smile/rules/master/js/spotify-proto.js"
    - "Spotify.Crack.Dev.js"
    - "Spotify.Crack.js"
    - "DualSubs.Spotify."


modules:
  - name: unlock-primary
    cache: unlock-primary.sgmodule
    role: primary
    local: true
    note: "合集标题壳；跳过代理等内容由 supplements 并入"

  - name: skip-proxy-collection
    cache: skip-proxy-collection.module
    role: supplement
    local: true
    note: "mieqq+Sukka+iamsweet 等跳过代理/RealIP 合并去重（唯一入口）"

  - name: qingrex-unlock
    cache: qingrex-unlock.sgmodule
    role: supplement
    local: true
    note: "QingRex/可莉 — 全仓库解锁/HTTPDNS/Spotify 等（自动生成）"

  - name: fmz200-unlock-extra
    cache: fmz200-unlock-extra.sgmodule
    role: supplement
    local: true
    note: "奶思 — HTTPDNS 等解锁补充（自动生成）"

  - name: miranquil-qq-unlock
    cache: miranquil-qq.sgmodule
    role: supplement
    upstream: https://raw.githubusercontent.com/miranquil/surge-scripts/main/tencent/c-pc-page/module.sgmodule
    note: "miranquil — QQ 非官方/禁止访问页解锁"

  - name: iewha-unlock
    cache: iewha-unlock.sgmodule
    role: supplement
    upstream: https://raw.githubusercontent.com/iEwha/Profiles/master/Surge/Unlock.sgmodule
