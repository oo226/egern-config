name: PingMe
description: PingMe 抓参 + 定时签到（模块参数可开关抓参；v3）
author: oo226/egern-config
homepage: https://github.com/oo226/egern-config
category: 签到
compat_arguments:
  # ASCII 键名；值会替换到 match。关抓参：把 CAPTURE_MATCH 改成 #
  CAPTURE_MATCH: "^https://api\\.pingmeapp\\.net/app/queryBalanceAndBonus"
  CRONEXP: "30 8,20 * * *"
compat_arguments_desc: |
  CAPTURE_MATCH（抓参开关）：
  · 开启：保持默认 URL 正则
  · 关闭：改成单独一个 #（抓完务必改）

  CRONEXP：签到定时，默认每天 8:30 与 20:30。
scriptings:
  - http_request:
      name: PingMe获取参数
      match: "{{{CAPTURE_MATCH}}}"
      script_url: "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/PingMe-capture.js"
      timeout: 60
      enabled: true
  - schedule:
      name: PingMe签到
      cron: "{{{CRONEXP}}}"
      script_url: "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/PingMe-signin.js"
      timeout: 300
      enabled: true
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
