name: PingMe
description: PingMe 抓参 + 定时签到（Egern 原生模版参数；抓完请关掉抓参）
author: oo226/egern-config
homepage: https://github.com/oo226/egern-config
category: 签到
compat_arguments:
  # 此值会直接当作 http_request.match；填 # 则永远匹配不到 = 关闭抓参
  是否开启抓取重写: "^https://api\\.pingmeapp\\.net/app/queryBalanceAndBonus"
  CRONEXP: "30 8,20 * * *"
compat_arguments_desc: |
  是否开启抓取重写：
  · 开启抓参：保持默认的 URL 正则（不要填「PingMe抓参」四个字，Egern 里无效）
  · 关闭抓参：改成单独一个 #
  抓完务必改成 #。

  CRONEXP：签到定时，默认 8:30 与 20:30。
scriptings:
  - http_request:
      name: PingMe获取参数
      match: "{{{是否开启抓取重写}}}"
      script_url: "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/PingMe-capture.js"
      timeout: 60
      enabled: true
  - schedule:
      name: PingMe签到
      cron: "{{{CRONEXP}}}"
      script_url: "https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Scripts/PingMe-signin.js"
      timeout: 300
      enabled: true
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
