# 本分支 Yuanban 树：手动或检测到需要时重建。不动 sync 日更。
name: Yuanban 重建（本分支）

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建（邮件/频道更新提示时勾选）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yuanban-formal
  cancel-in-progress: true

env:
  ADBLOCK_BRANCH: cursor/adblock-formal-f611

jobs:
  rebuild:
    if: github.ref == 'refs/heads/cursor/adblock-formal-f611' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ADBLOCK_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Yuanban
        env:
          ADBLOCK_BRANCH: ${{ env.ADBLOCK_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-yuanban.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; else
            git commit -m "chore: refresh Yuanban"
            git push origin HEAD:${{ env.ADBLOCK_BRANCH }}
          fi
