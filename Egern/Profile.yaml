# ------------------------------------------
# 六、MITM
# ------------------------------------------
mitm:
  ca_p12: egern.p12
  ca_passphrase: egern
  hostnames:
    includes:
      - raw.githubusercontent.com
      - gist.githubusercontent.com
    excludes:
      - '*.wechat.com'
      - '*.weixin.com'
      - '*.alipay.com'
      - '*.microsoft.com'
      - '*.icloud.com'
