      policy: 追风挂机
      update_interval: 604800

  - rule_set:
      name: 局域网
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/heji/fenliu/Repcz-局域网.yaml
      policy: DIRECT
      update_interval: 604800
  - rule_set:
      name: 私有网络
