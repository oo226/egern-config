# Tailscale 直连（规则集）
# - Profile rules 最前挂本文件 → DIRECT（100.64/10 + fd7a::/48 + 控制面域名）
# - Profile 还需：real_ip_domains（*.ts.net 等）+ bypass_tunnel_proxy（同域名）
# - Egern 内置 TS：不要把 100.64/10 放进 vif_excluded（否则登录后 ping 不通）
# - 官方 Tailscale App 并存：再把 100.64/10、fd7a::/48 加回 vif_excluded
# - 「绕路」= DERP 中继：两端 Hard NAT / UDP 被挡时正常，看控制台 direct vs relay

no_resolve: true
domain_suffix_set:
  - ts.net
  - tailscale.com
  - tailscale.net
ip_cidr_set:
  - 100.64.0.0/10
ip_cidr6_set:
  - fd7a:115c:a1e0::/48
