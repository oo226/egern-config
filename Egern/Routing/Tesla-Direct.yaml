# 特斯拉中国 App 直连
# Proxy.yaml 里误含 tesla.cn / tesla.com.cn 等，走代理会出现「无网络连接」、看不到车位置
# 须挂在「代理列表」之前

no_resolve: true
domain_suffix_set:
  - tesla.cn
  - tesla.com.cn
  - teslamotors.cn
  - teslamotors.com.cn
  - tesla-cdn.thron.cn
  - auth.tesla.cn
  - owner-api.vn.cloud.tesla.cn
  # 下列在部分机型也会打到；国内账号一并直连更稳
  - tesla.com
  - teslamotors.com
  - tesla.services
  - teslaenergy.services
  - tesla-cdn.thron.com
  - teslazta.net
  - ts.la
  - solarcity.com
