      - Surge/
    include_modules:
      - "^Surge/.+\\.(sgmodule|module)$"

  - id: blackmatrix7
    github: blackmatrix7/ios_rule_script
    branch: master
    strip_module_prefixes:
      - rewrite/Surge/
    include_modules:
      - "^rewrite/Surge/.+\\.sgmodule$"

  - id: mieqq
