# ── 代理检测专项：每日扫描，命中则写入索引（订阅用上游原链）──
proxy_detect:
  keywords:
    - skip-proxy
    - always-real-ip
    - 代理检测
    - 跳过代理
    - 检测代理
    - Skip Proxy
    - REAL-IP
    - real-ip
    - 绕过代理检测
    - 防代理检测

  # 固定种子（必收录，url 为用户应订阅的上游链接）
  seeds:
    - id: mieqq-skip-proxy
      name: mieqq 跳过代理检测
      kind: module
      url: https://raw.githubusercontent.com/mieqq/mieqq/master/skip-proxy-lists.sgmodule
      homepage: https://github.com/mieqq/mieqq
      tags: [代理检测, skip-proxy, mieqq]

    - id: sukka-always-realip
      name: Sukka Always Real IP Plus
      kind: module
      url: https://ruleset.skk.moe/Modules/sukka_common_always_realip.sgmodule
      homepage: https://ruleset.skk.moe/
      tags: [代理检测, always-real-ip, Sukka]

    - id: iamsweet-skip-proxy
      name: iamsweet Skip Proxy Lists
      kind: module
      url: https://raw.githubusercontent.com/iamsweet/Surge-Skip-Proxy-Lists/main/skip-proxy-lists.sgmodule
      homepage: https://github.com/iamsweet/Surge-Skip-Proxy-Lists
      tags: [代理检测, skip-proxy]

  # GitHub 仓：列 tree，文件名/路径命中关键词则整条收录（上游 raw）
  watch_repos:
    - github: mieqq/mieqq
      branch: master
      content_scan: true
    - github: iamsweet/Surge-Skip-Proxy-Lists
      branch: main
      content_scan: true
    - github: Rabbit-Spec/Surge
      branch: Master
      path_prefix: Module/Spec/Skip-Proxy/
      content_scan: true
    - github: fmz200/wool_scripts
      branch: main
      path_prefix: Surge/module/
      # 大仓：只收文件名含 skip-proxy / 代理检测 的
    - github: QingRex/LoonKissSurge
      branch: main
      path_prefix: Surge/
      # 大仓：只收文件名命中

  # 本地已镜像 Modules/_upstream/<id>/ 再扫一遍（作者仓下载后）
  scan_local_upstream: true

# ── 上游「大合集」差集检测（每日）：有我们没有的脚本就镜像进 _external 并改写合集链接 ──
