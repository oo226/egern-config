# 原生 Egern PingMe — 开关对齐 IBL3ND compat_arguments_schema
name: PingMe 签到助手
description: PingMe 抓参 + 定时签到。抓参默认开；打开 App 等到获取成功 → 关掉 → 签到。
author: 怎么肥事 (Adapted for Egern)
homepage: https://github.com/oo226/egern-config
icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
compat_arguments:
  pingmeCapture: 'true'
  CRONEXP: 30 8,20 * * *
  TIMEOUT: '300'
compat_arguments_schema:
  pingmeCapture:
    name: PingMe 抓参
    description: 默认开。打开 PingMe（我的/余额页）等到「获取成功」后改成 false，再跑签到。
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  CRONEXP:
    name: 签到定时
    description: 默认每天 8:30 与 20:30
    default_value: 30 8,20 * * *
  TIMEOUT:
    name: 超时秒数
    description: 默认 300
    default_value: '300'
dns: {}
scriptings:
  - http_request:
      name: PingMe获取参数
      match: '^https://api\.pingmeapp\.net/app/queryBalanceAndBon[{{{pingmeCapture}}}]s'
      script_url: https://cdn.jsdelivr.net/gh/oo226/egern-config@guize/Yuanban/qiandao/js/PingMe-cook.js
      timeout: 60
  - schedule:
      name: PingMe签到
      cron: '{{{CRONEXP}}}'
      script_url: https://cdn.jsdelivr.net/gh/oo226/egern-config@guize/Yuanban/qiandao/js/PingMe-signin.js
      timeout: {{{TIMEOUT}}}
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
