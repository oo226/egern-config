# 原生 Egern PingMe — 固定匹配 URL；开关只控制 CAPTURE= 是否写入
name: PingMe 签到助手
description: PingMe 抓参 + 定时签到。打开 App 我的/余额等到获取成功 → 关掉抓参 → 签到。
author: 怎么肥事 (Adapted for Egern)
homepage: https://github.com/oo226/egern-config
icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
compat_arguments:
  pingmeCapture: 'true'
  CRONEXP: 30 8,20 * * *
  TIMEOUT: '300'
compat_arguments_schema:
  pingmeCapture:
    name: PingMe 抓参
    description: 默认开。开着打开 PingMe 应弹出「获取成功」；抓到后改 false 再签到。
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  CRONEXP:
    name: 签到定时
    description: 默认每天 8:30 与 20:30
    default_value: 30 8,20 * * *
  TIMEOUT:
    name: 超时秒数
    description: 默认 300
    default_value: '300'
dns: {}
scriptings:
  - http_request:
      name: PingMe获取参数
      match: '^https://api\.pingmeapp\.net/app/queryBalanceAndBonus'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-capture.js
      timeout: 60
      arguments:
        _compat.$argument: CAPTURE={{{pingmeCapture}}}
  - http_response:
      name: PingMe获取参数兜底
      match: '^https://api\.pingmeapp\.net/app/queryBalanceAndBonus'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-capture.js
      body_required: false
      timeout: 60
      arguments:
        _compat.$argument: CAPTURE={{{pingmeCapture}}}
  - schedule:
      name: PingMe签到
      cron: '{{{CRONEXP}}}'
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-signin.js
      timeout: {{{TIMEOUT}}}
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
      - '*.pingmeapp.net'
