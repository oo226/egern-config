# 原生 Egern PingMe 单件（Profile 日常用 qiandao.sgmodule）
# 用法：开模块 → 打开 PingMe App 等到「获取成功」→ 手动跑「签到」或等 cron
name: PingMe 签到助手
author: 怎么肥事 (Adapted for Egern)
dns: {}
scriptings:
  - http_request:
      name: 参数
      match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-cook.js
      timeout: 60
  - schedule:
      name: 签到
      cron: 30 8,20 * * *
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe.js
      timeout: 300
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
