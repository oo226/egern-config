# 原生 Egern 签到合集（PingMe + 起点）
# 抓参用 compat_arguments 布尔 + disabled，模块设置里可改；true/false 在 Egern 会出开关
# 用法：打开「是否禁用*抓参」关掉（false）→ 打开对应 App → 再开回禁用（true）→ 签到
name: 签到合集
description: PingMe + 起点。抓参默认禁用；需要时关掉对应「禁用」开关抓参，抓完再打开。
author: 怎么肥事 / Yuheng / oo226
icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
homepage: https://github.com/oo226/egern-config
compat_arguments:
  # disabled 语义：true=不跑抓参脚本（默认）
  是否禁用PingMe抓参: true
  是否禁用起点抓参: true
  PingMeCRON: 30 8,20 * * *
  起点CRON: 11 2 * * *
  TIMEOUT: 300
  是否开启调试模式: false
  是否开启激励任务: false
  是否开启每日任务: false
  是否开启每日抽奖: false
  是否开启每周兑换: false
  是否开启章节卡片: false
  是否开启大咖荐书: false
compat_arguments_desc: |
  1️⃣ 是否禁用PingMe抓参 / 是否禁用起点抓参
  默认 true（不抓）。要抓参：改成 false → 打开对应 App → 改回 true → 签到。
  Egern 对 true/false 参数会显示开关。开着抓参跑 PingMe 签到易 400 body:Error。

  2️⃣ PingMeCRON / 起点CRON / TIMEOUT
  定时与超时。

  3️⃣ 其余起点任务开关
  true/false。
scriptings:
  - http_request:
      name: PingMe获取参数
      match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-cook.js
      timeout: 60
      disabled: {{{是否禁用PingMe抓参}}}
  - schedule:
      name: PingMe签到
      cron: "{{{PingMeCRON}}}"
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/qiandao/js/PingMe-signin.js
      timeout: {{{TIMEOUT}}}
  - http_response:
      name: 起点获取Cookie
      match: ^https?:\/\/h5\.if\.qidian\.com\/argus\/api\/v1\/user\/getlogininfo
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/zuozhe/local/js/qdreader.js
      body_required: true
      max_size: -1
      disabled: {{{是否禁用起点抓参}}}
      arguments:
        _compat.$argument: QDREADER_DEBUG="{{{是否开启调试模式}}}"
  - schedule:
      name: 起点读书自动签到
      cron: "{{{起点CRON}}}"
      script_url: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/guize/Yuanban/zuozhe/local/js/qdreader.js
      timeout: {{{TIMEOUT}}}
      arguments:
        _compat.$argument: QDREADER_DEBUG="{{{是否开启调试模式}}}"&QDREADER_ADV_JOB_ENABLE="{{{是否开启激励任务}}}"&QDREADER_EXTRA_ADV_JOB_ENABLE="{{{是否开启每日任务}}}"&QDREADER_LOTTERY_ENABLE="{{{是否开启每日抽奖}}}"&QDREADER_WEEKLY_EXCHANGE_ENABLE="{{{是否开启每周兑换}}}"&QDREADER_CHAPTER_CARD_ENABLE="{{{是否开启章节卡片}}}"&QDREADER_MESSAGE_BOX_ENABLE="{{{是否开启大咖荐书}}}"
mitm:
  hostnames:
    includes:
      - api.pingmeapp.net
      - h5.if.qidian.com
